<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>החוש החסר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: flat colour blocks on a clean white field, like the school's signage. A hard-edged grid, no rounded cards; colour = stage of the 7D process. */
:root{
  --navy:#215068; --teal:#4bc3c0; --orange:#f18215; --yellow:#f6ad0c; --red:#ea3144;
  --bg:#ffffff; --fg:#1d3a4b; --muted:#5b7482; --line:#d6e2e8; --soft:#f2f7f9;
  --ink-on-color:#ffffff; --ink-on-yellow:#1d3a4b;
  --d1:var(--yellow); --d2:var(--teal); --d3:var(--orange); --d4:var(--red); --d5:var(--navy);
  --display:"Secular One","Assistant","Arial Hebrew",Arial,sans-serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#132f3e; --fg:#eef5f7; --muted:#a6bfca; --line:#2c4f62; --soft:#1a3b4d; --navy:#2c6584;
  color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#132f3e; --fg:#eef5f7; --muted:#a6bfca; --line:#2c4f62; --soft:#1a3b4d; --navy:#2c6584; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
p{margin:0}

/* top wave band */
.band{height:56px;background:linear-gradient(176deg,var(--yellow) 0 38%,transparent 38.5%),linear-gradient(184deg,transparent 30%,var(--red) 30.5%) ; background-color:var(--bg)}
.band{background:none;position:relative;overflow:hidden}
.band svg{position:absolute;inset:0;width:100%;height:100%}

header.top{padding-block:20px 8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.brand a{text-decoration:none}
.brand .mark{font-family:var(--display);font-size:clamp(34px,6vw,58px);color:var(--teal);line-height:1}
.brand .mark b{font-weight:400;color:var(--fg)}
.brand .sub{color:var(--muted);font-size:15px}

nav.groups{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
nav.groups a{text-decoration:none;font-weight:700;font-size:15px;padding:6px 12px;border:2px solid var(--line)}
nav.groups a:hover,nav.groups a[aria-current="page"]{border-color:var(--fg)}

main{padding-block:24px 64px}
section{scroll-margin-top:16px}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(28px,4.4vw,44px)}
.hero h2 mark{background:var(--orange);color:#fff;padding:0 .2em}
.hero p.lead{font-size:19px;margin-top:14px;max-width:60ch}
.qbox{background:var(--navy);color:#fff;padding:22px}
.qbox h3{font-size:22px;margin-bottom:8px;color:var(--yellow)}

.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:34px}
@media (max-width:820px){.phases{grid-template-columns:repeat(2,1fr)}}
.ph{padding:14px;color:var(--ink-on-color);min-width:0}
.ph .n{font-family:var(--display);font-size:26px;line-height:1}
.ph .t{font-weight:700}
.ph small{display:block;font-size:14px;opacity:.95;line-height:1.4;margin-top:4px}
.ph.d1{background:var(--d1);color:var(--ink-on-yellow)}.ph.d2{background:var(--d2);color:#0f3442}.ph.d3{background:var(--d3)}.ph.d4{background:var(--d4)}.ph.d5{background:#215068}
.ph.dim{opacity:.55}

h2.sec{font-size:30px;margin:48px 0 6px}
.sec-sub{color:var(--muted);margin-bottom:18px;max-width:70ch}

.senses{display:grid;gap:26px}
.sense h3{font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sense h3 .sw{width:18px;height:18px;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;border:2px solid var(--line);text-decoration:none;min-width:0;background:var(--bg);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--fg);transform:translateY(-2px)}
.card .k{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.card .h{font-family:var(--display);font-size:21px;line-height:1.2}
.card .c{font-size:15px;color:var(--muted)}

.intel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:900px){.intel{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.intel{grid-template-columns:1fr}}
.in{border-top:6px solid var(--orange);background:var(--soft);padding:14px;min-width:0}
.in h4{font-size:19px}
.in p{font-size:15px;margin-top:4px}

/* project page */
.crumb{font-size:15px;color:var(--muted);margin-bottom:10px}
.crumb a{font-weight:700}
.ptitle{font-size:clamp(30px,5vw,50px)}
.pmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:14px;font-weight:700;padding:3px 10px;background:var(--soft);border:1px solid var(--line)}
.contrast{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-top:22px;align-items:stretch}
.contrast div{padding:14px 16px;font-family:var(--display);font-size:21px;line-height:1.25;min-width:0}
.contrast .a{background:var(--navy);color:#fff}
.contrast .x{background:var(--yellow);color:#1d3a4b;display:flex;align-items:center;font-size:26px}
.contrast .b{background:var(--teal);color:#0f3442}
@media (max-width:560px){.contrast{grid-template-columns:1fr}.contrast .x{justify-content:center;padding:4px}}

.stage{margin-top:40px;display:grid;grid-template-columns:120px 1fr;gap:20px}
@media (max-width:720px){.stage{grid-template-columns:1fr;gap:10px}}
.stage>aside{padding:12px;min-width:0}
.stage>aside .n{font-family:var(--display);font-size:34px;line-height:1}
.stage>aside .t{font-family:var(--display);font-size:20px}
.stage>aside small{display:block;font-size:13px;line-height:1.35;margin-top:4px}
.stage.d1>aside{background:var(--d1);color:#1d3a4b}
.stage.d2>aside{background:var(--d2);color:#0f3442}
.stage.d34>aside{background:linear-gradient(var(--d3) 0 50%,var(--d4) 50%);color:#fff}
.stage>div{min-width:0;display:grid;gap:22px}
.stage h3{font-size:23px;margin-bottom:8px}
.stage h4{font-size:18px;margin-bottom:6px}
ul.q{margin:0;padding-inline-start:20px;display:grid;gap:6px}
ul.q li::marker{color:var(--orange)}
.legs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:720px){.legs{grid-template-columns:1fr}}
.leg{border:2px solid var(--line);padding:12px;min-width:0}
.leg b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--teal)}
.leg p{font-size:15px}

.builder{background:var(--soft);padding:16px;border-inline-start:6px solid var(--yellow)}
.builder .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media (max-width:600px){.builder .grid{grid-template-columns:1fr}}
.builder label{font-size:14px;font-weight:700;display:grid;gap:4px}
.builder input{font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.builder .out{margin-top:14px;font-family:var(--display);font-size:21px;line-height:1.35}
.builder .out span{background:var(--yellow);color:#1d3a4b;padding:0 .15em}
.builder .out span.empty{background:transparent;color:var(--muted);border-bottom:2px dashed var(--muted)}
.btn{font:inherit;font-weight:700;font-size:15px;padding:7px 14px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--fg);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.note{font-size:14px;color:var(--muted)}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:820px){.tools{grid-template-columns:1fr}}
.tool{border:2px solid var(--line);padding:14px;min-width:0}
.tool h4{display:flex;gap:8px;align-items:flex-start}
.tool input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:2px}
.tool ul{margin:6px 0 0;padding-inline-start:18px;font-size:15px;display:grid;gap:4px}

/* links */
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:14px;font-weight:700;padding:4px 10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ol.links{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0;counter-reset:l}
ol.links li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line);counter-increment:l}
ol.links li::before{content:counter(l);font-family:var(--display);font-size:24px;color:var(--teal);line-height:1.1;font-variant-numeric:tabular-nums}
ol.links li>div{min-width:0}
ol.links a.t{font-weight:700;font-size:18px;text-decoration-color:var(--teal);text-underline-offset:3px;overflow-wrap:anywhere}
ol.links .tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tag{font-size:12px;font-weight:700;padding:1px 8px;letter-spacing:.03em}
.tag.d1{background:var(--d1);color:#1d3a4b}.tag.d2{background:var(--d2);color:#0f3442}
.tag.kind{background:var(--soft);border:1px solid var(--line)}
ol.links p{font-size:16px}
ol.links .use{font-size:15px;color:var(--muted);margin-top:4px}
ol.links .use b{color:var(--fg)}

.nosol{background:var(--red);color:#fff;padding:14px 16px;font-weight:700}
.nosol b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.iq{display:grid;gap:8px}
.iq details{border:2px solid var(--line);padding:0}
.iq summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-size:19px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.iq summary::-webkit-details-marker{display:none}
.iq summary::after{content:"+";color:var(--orange)}
.iq details[open] summary::after{content:"–"}
.iq details>div{padding:0 14px 14px}
.iq .def{font-size:14px;color:var(--muted);margin-bottom:6px}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:20px}
.gi{border:2px solid var(--line);display:flex;flex-direction:column;min-width:0}
.gi .pic{aspect-ratio:16/9;max-width:100%;display:flex;align-items:center;justify-content:center}
.gi .pic svg{height:70%}
.gi .gb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gi h3{font-size:22px}
.gi p{font-size:15px}
.gi .use{font-size:14px;color:var(--muted)}
.gi .more{margin-top:auto;font-weight:700;text-decoration:none;color:var(--fg);border-top:1px solid var(--line);padding-top:8px}
.gi .more:hover{color:var(--orange)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:48px;flex-wrap:wrap}
.pager a{font-weight:700;text-decoration:none;border:2px solid var(--line);padding:10px 14px;max-width:48%}
.pager a:hover{border-color:var(--fg)}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="band" aria-hidden="true"><svg viewBox="0 0 1200 56" preserveAspectRatio="none"><path d="M0 0H760C600 10 420 24 0 40Z" fill="#f6ad0c"/><path d="M300 0H1200V44C1020 20 860 14 720 16 560 18 430 8 300 0Z" fill="#ea3144"/></svg></div>

<div class="wrap">
<header class="top">
  <div class="brand">
    <a href="#home" class="mark">החוש <b>החסר</b></a>
    <span class="sub">מיני-פרויקט בעיצוב מוצר · מגמת אמנויות העיצוב, כיתה י״א · שאלון 891589</span>
  </div>
  <nav class="groups" id="nav" aria-label="ניווט"></nav>
</header>
<main id="app"></main>
<footer>אתר השראה וכיווני חשיבה בלבד. הפתרון הוא שלכן. המקורות נבחרו כנקודת פתיחה; בדקו כל מקור בעצמכן ורשמו אותו בביבליוגרפיה.</footer>
</div>

<script>
const PROJECTS = [
/* ================= שמיעה ================= */

legs:["חרשים מלידה / מי שאיבדו שמיעה בגיל מבוגר / כבדי שמיעה עם מכשיר. מי מהם ומה ההבדל ביניהם?","הדרה מחוויה תרבותית משותפת, תלות בתרגום, תחושת ״אורח״ באירוע.","הופעה באולם / חתונה / שיעור מוזיקה בבית ספר / האזנה לבד בחדר. רעש, צפיפות, חושך, זמן."],
bound:"האם הפרויקט עוסק בהאזנה למוזיקה, ביצירת מוזיקה, או בחוויה החברתית סביבה? בחרו אחד."},
d2:{persona:["ראיון עם אדם חרש שאוהב מוזיקה: איך הוא ״שומע״ אותה היום? (רצפת עץ, רמקול מוחזק, בלונים?)","תצפית: צפו בהופעה בתרגום לשפת סימנים ותעדו מה עושה הקהל החרש בגוף."],
bench:["SubPac (אפוד באס)","Neosensory Buzz (צמיד)","הופעות עם רצפה רוטטת / מתורגמני שירים","בלון מוחזק מול רמקול (הפתרון הביתי)"],
stem:["קולטני פאצ׳יני: באילו תדרים העור הכי רגיש?","הולכת עצם מול הולכת אוויר","פירוק צליל לתדרים (התמרת פורייה)","מוליכות רטט בחומרים: עץ, אלומיניום, סיליקון בדרגות קושי"]},
links:[
{t:"Evelyn Glennie – Hearing Essay",u:"https://www.evelyn.co.uk/hearing-essay/",p:"d1",k:"מאמר",lang:"EN",s:"המתופפת החירשת אוולין גלני מסבירה ש״שמיעה היא צורה מיוחדת של מגע״: איך היא מרגישה צלילים נמוכים ברגליים וגבוהים בפנים ובצוואר.",use:"ציטוטים אותנטיים למבוא ולמפת האמפתיה."},
{t:"Evelyn Glennie: How to truly listen (TED)",u:"https://www.ted.com/talks/evelyn_glennie_how_to_truly_listen",p:"d1",k:"וידאו",lang:"EN",s:"הרצאה שבה גלני מנגנת ומדגימה שהקשבה היא פעולה של כל הגוף, לא רק של האוזן.",use:"צפו בשפת הגוף שלה: היכן בגוף היא ״קולטת״?"},
{t:"Christine Sun Kim: The enchanting music of sign language (TED)",u:"https://www.ted.com/talks/christine_sun_kim_the_enchanting_music_of_sign_language",p:"d1",k:"וידאו",lang:"EN",s:"אמנית סאונד חירשת מראה ששפת הסימנים היא מוזיקלית, ושצליל הוא ״מטבע חברתי״ בעולם השומעים.",use:"עוזר לנסח את הניגוד ולערער על ההנחה שהבעיה היא ״לתקן״."},
{t:"Brains of deaf people rewire to “hear” music",u:"https://www.washington.edu/news/2001/11/27/brains-of-deaf-people-rewire-to-hear-music/",p:"d2",k:"מחקר",lang:"EN",s:"מחקר מאוניברסיטת וושינגטון (2001): אצל חרשים, רטט מעובד באזור השמיעה במוח. בסיס מדעי לכך שרטט הוא ״שמיעה״.",use:"שורה בטבלת התובנות: מה בדקנו → מה גילינו."},
{t:"Pacinian corpuscle",u:"https://en.wikipedia.org/wiki/Pacinian_corpuscle",p:"d2",k:"STEM",lang:"EN",s:"קולטני הלחץ והרטט בעור, הרגישים במיוחד לתדרים של כ-250 הרץ. היכן הם מרוכזים בגוף?",use:"מחקר טכנולוגי-חומרי: מיפוי אזורי רגישות בגוף."},

{t:"SubPac",u:"https://subpac.com/",p:"d2",k:"מוצר קיים",lang:"EN",s:"אפוד/גב כיסא שמעביר באסים לגוף. תוכנן במקור למפיקי מוזיקה שומעים.",use:"בנצ׳מרקינג: למי הוא תוכנן? מה המחיר? מה הוא לא נותן למשתמש חרש?"},
{t:"Neosensory",u:"https://neosensory.com/",p:"d2",k:"מוצר קיים",lang:"EN",s:"צמיד שמתרגם צלילים מהסביבה לדפוסי רטט על פרק היד, פרי מחקר של דייוויד איגלמן.",use:"בנצ׳מרקינג: ממשק, ארגונומיה, שפה חזותית."},

function glyph(how){
  const c={vib:"#f18215",touch:"#ea3144",sound:"#4bc3c0",light:"#f6ad0c",shape:"#215068",human:"#5b7482"}[how];
  const g={
    vib:`<rect x="38" y="30" width="24" height="40" fill="${c}"/><path d="M28 36q-6 14 0 28M20 30q-10 20 0 40M72 36q6 14 0 28M80 30q10 20 0 40" stroke="${c}" stroke-width="4" fill="none"/>`,
    touch:`<g fill="${c}">${[0,1,2].map(r=>[0,1].map(k=>`<circle cx="${40+k*20}" cy="${28+r*22}" r="7"/>`).join("")).join("")}</g>`,
    sound:`<path d="M24 42h12l16-14v44L36 58H24z" fill="${c}"/><path d="M62 38q8 12 0 24M70 30q14 20 0 40" stroke="${c}" stroke-width="4" fill="none"/>`,
    light:`<circle cx="50" cy="50" r="16" fill="${c}"/><g stroke="${c}" stroke-width="4">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${50+24*Math.cos(r)}" y1="${50+24*Math.sin(r)}" x2="${50+32*Math.cos(r)}" y2="${50+32*Math.sin(r)}"/>`}).join("")}</g>`,
    shape:`<polygon points="30,70 46,38 62,70" fill="${c}"/><circle cx="68" cy="40" r="10" fill="none" stroke="${c}" stroke-width="4"/><rect x="24" y="24" width="14" height="14" fill="${c}"/>`,
    human:`<circle cx="36" cy="38" r="9" fill="${c}"/><circle cx="64" cy="38" r="9" fill="${c}"/><path d="M22 72q14-22 28 0q14-22 28 0" fill="${c}"/>`
  }[how];
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${HOW[how].n}">${g}</svg>`;
}

function wireGallery(){
  const apply=()=>{
    const f=store.get("gal-filter",{sense:"all",how:"all"}); let n=0;
    document.querySelectorAll(".gi").forEach(el=>{const ok=(f.sense==="all"||el.dataset.sense===f.sense)&&(f.how==="all"||el.dataset.how===f.how);el.hidden=!ok;if(ok)n++;});
    document.getElementById("gal-empty").hidden=n>0;
  };
  document.querySelectorAll("[data-gal]").forEach(g=>g.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const f=store.get("gal-filter",{sense:"all",how:"all"}); f[g.dataset.gal]=b.dataset.v; store.set("gal-filter",f);
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); apply();
  }));
  apply();
}

const store = {
  get(k,d){try{const v=localStorage.getItem("hachush:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("hachush:"+k,JSON.stringify(v))}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function nav(active){
  const n=document.getElementById("nav");
  n.innerHTML = `<a href="#home" ${active==="home"?'aria-current="page"':""}>כל הנושאים</a><a href="#gallery" ${active==="gallery"?'aria-current="page"':""} style="background:var(--yellow);color:#1d3a4b;border-color:var(--yellow)">גלריית השראה</a>` +
    PROJECTS.map(p=>`<a href="#${p.id}" ${active===p.id?'aria-current="page"':""} style="border-bottom-color:${SENSES[p.sense].color}">${esc(p.title)}</a>`).join("");
}

  return `<div class="crumb"><a href="#home">כל הנושאים</a> · ${SENSES[p.sense].name}</div>
  <h2 class="ptitle">${esc(p.title)}</h2>
  <div class="pmeta"><span class="chip">${esc(p.who)}</span><span class="chip">${p.links.length} מקורות</span></div>
  <div class="contrast" aria-label="הניגוד המרכזי"><div class="a">${esc(p.contrast[0])}</div><div class="x">⟷</div><div class="b">${esc(p.contrast[1])}</div></div>

  <section class="stage d1" id="d1-${p.id}"><aside><div class="n">D1</div><div class="t">חריש</div><small>תשתית ומכוון עיצוב · 1–2 עמודים</small></aside><div>
    <div><h3>מה לא עובד כרגע?</h3><ul class="q">${p.d1.pain.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
    <div><h3>בסיס שלוש הרגליים</h3><p class="note" style="margin-bottom:8px">אפשרויות לבחירה. בחרו אחת מכל רגל, ודייקו.</p>
      <div class="legs">${p.d1.legs.map((l,i)=>`<div class="leg"><b>${legsNames[i]}</b><p>${esc(l)}</p></div>`).join("")}</div></div>
    <div class="builder"><h3>בונה שאלת האתגר</h3><p class="note">התבנית המחייבת. מה שתכתבו נשמר רק בדפדפן שלכן.</p>
      <div class="grid">
        <label for="cq-v-${p.id}">כיצד נוכל ל… (פועל)<input id="cq-v-${p.id}" data-k="v" value="${esc(cq.v)}" placeholder="לדוגמה: להנגיש, לחבר, לצמצם"></label>
        <label for="cq-x-${p.id}">את… (הבעיה)<input id="cq-x-${p.id}" data-k="x" value="${esc(cq.x)}"></label>
        <label for="cq-w-${p.id}">עבור… (קהל היעד)<input id="cq-w-${p.id}" data-k="w" value="${esc(cq.w)}"></label>
        <label for="cq-c-${p.id}">תוך… (אילוץ / הזדמנות / חיבור)<input id="cq-c-${p.id}" data-k="c" value="${esc(cq.c)}"></label>
      </div>
      <p class="out" id="cq-out" aria-live="polite"></p>
      <div class="row"><button class="btn" type="button" id="cq-copy">העתקה</button><span class="note" id="cq-msg"></span></div>
    </div>
    <div><h3>גבולות גזרה</h3><p>${esc(p.d1.bound)}</p></div>
  </div></section>

  <section class="stage d2" id="d2-${p.id}"><aside><div class="n">D2</div><div class="t">זריעה</div><small>מחקר עיצוב מבוסס STEM · 4–6 עמודים</small></aside><div>
    <div><h3>שלושת כלי המחקר</h3><p class="note" style="margin-bottom:8px">חובה לפחות שניים. סמנו מה בחרתן.</p>
    <div class="tools">
      ${[["persona","מחקר משתמשים משתף",p.d2.persona],["bench","מחקר שוק (בנצ׳מרקינג): מה למפות",p.d2.bench],["stem","מחקר טכנולוגי-חומרי (STEM)",p.d2.stem]].map(([k,n,arr])=>`
      <div class="tool"><h4><input type="checkbox" id="tool-${p.id}-${k}" data-tool="${k}" ${done[k]?"checked":""}><label for="tool-${p.id}-${k}">${n}</label></h4><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}
    </div></div>
    <div><h3>עמוד התובנות (חובה)</h3><p>לכל מקור שבחרתן: <b>מה בדקנו ← מה גילינו ← מה המסקנה העיצובית?</b> ובסוף, 2–3 ״הזדמנויות לפעולה״.</p></div>
    <div>${linkList(p.links,p.id)}</div>
  </div></section>

  <section class="stage d34" id="d34-${p.id}"><aside><div class="n">D3·D4</div><div class="t">נביטה והנצה</div><small>רעיונאות, סינון ומודלים</small></aside><div>
    <div class="nosol"><b>כאן אין פתרונות.</b>רק שאלות. כל אחד מ-15–20 הרעיונות שלכן צריך לעבור דרך חמש השאלות האלה.</div>
    <div class="iq">${INTEL.map((i,n)=>`<details ${n===0?"open":""}><summary>${i.n}</summary><div><p class="def">${i.d}</p><p>${esc(p.intel[i.k])}</p></div></details>`).join("")}</div>
    <div><h4>שאלות לסינון (מטריצת ההחלטה)</h4><ul class="q">
      <li>איזה רעיון עונה הכי מדויק על הכאב שהגדרתן בחריש, ולא על כאב אחר?</li>
      <li>מה תלמדו ממודל מקרטון בקנה מידה 1:1 שלא תלמדו מסקיצה?</li>
      <li>מה אמר המשתמש כשנגע במודל? מה הפתיע אותו?</li>
      <li>האם הוא הבין מה לעשות בשלוש השניות הראשונות?</li></ul></div>
  </div></section>

  <div class="pager"><a href="#${prev.id}">→ ${esc(prev.title)}</a><a href="#${next.id}">${esc(next.title)} ←</a></div>`;
}

function wire(p){
  document.querySelectorAll(".filters").forEach(g=>{
    g.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      const f=b.dataset.f; document.querySelectorAll(`#links-${g.dataset.for} li`).forEach(li=>{li.hidden = f!=="all" && li.dataset.p!==f;});
    });
  });
  if(!p) return;
  const ins=[...document.querySelectorAll(".builder input")], out=document.getElementById("cq-out");
  const parts=[["v","כיצד נוכל ל",""],["x"," את ",""],["w"," עבור ",""],["c"," תוך ","?"]];
  const render=()=>{
    const v={}; ins.forEach(i=>v[i.dataset.k]=i.value.trim());
    out.innerHTML = '"'+parts.map(([k,pre,post])=>esc(pre)+(v[k]?`<span>${esc(v[k])}</span>`:`<span class="empty">……</span>`)+post).join("")+'"';
    store.set("cq-"+p.id,v); return v;
  };
  ins.forEach(i=>i.addEventListener("input",render)); render();
  document.getElementById("cq-copy").addEventListener("click",()=>{
    const v=render(); const txt=`כיצד נוכל ל${v.v} את ${v.x} עבור ${v.w} תוך ${v.c}?`;
    const msg=document.getElementById("cq-msg");
    navigator.clipboard.writeText(txt).then(()=>msg.textContent="הועתק").catch(()=>{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="מסומן. אפשר להעתיק ידנית.";});
  });
  document.querySelectorAll("[data-tool]").forEach(c=>c.addEventListener("change",()=>{
    const d=store.get("tools-"+p.id,{}); d[c.dataset.tool]=c.checked; store.set("tools-"+p.id,d);
  }));
}

function route(){
  const id=(location.hash||"#home").slice(1);
  const p=PROJECTS.find(x=>x.id===id);
  const app=document.getElementById("app");
  if(id==="gallery"){app.innerHTML=gallery();wireGallery();document.title="גלריית השראה · החוש החסר";window.scrollTo(0,0);return;}
  app.innerHTML = p ? project(p) : home();
  wire(p);
  document.title = p ? p.title+" · החוש החסר" : "החוש החסר";
  if(p) window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
