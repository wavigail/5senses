<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>החוש החסר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: flat colour blocks on a clean white field, like the school's signage. A hard-edged grid, no rounded cards; colour = stage of the 7D process. */
:root{
  --navy:#215068; --teal:#4bc3c0; --orange:#f18215; --yellow:#f6ad0c; --red:#ea3144; --red-ink:#c8243a; --teal-ink:#1d7d7a;
  --bg:#ffffff; --fg:#1d3a4b; --muted:#5b7482; --line:#d6e2e8; --soft:#f2f7f9;
  --ink-on-color:#ffffff; --ink-on-yellow:#1d3a4b;
  --d1:var(--yellow); --d2:var(--teal); --d3:var(--orange); --d4:var(--red); --d5:var(--navy);
  --display:"Secular One","Assistant","Arial Hebrew",Arial,sans-serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#132f3e; --fg:#eef5f7; --muted:#a6bfca; --line:#2c4f62; --soft:#1a3b4d; --navy:#1d4a62; --teal-ink:var(--teal);
  color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#132f3e; --fg:#eef5f7; --muted:#a6bfca; --line:#2c4f62; --soft:#1a3b4d; --navy:#1d4a62; --teal-ink:var(--teal); color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
p{margin:0}

/* top wave band */
.band{height:56px;background:linear-gradient(176deg,var(--yellow) 0 38%,transparent 38.5%),linear-gradient(184deg,transparent 30%,var(--red) 30.5%) ; background-color:var(--bg)}
.band{background:none;position:relative;overflow:hidden}
.band svg{position:absolute;inset:0;width:100%;height:100%}

header.top{padding-block:20px 8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.brand a{text-decoration:none}
.brand .mark{font-family:var(--display);font-size:clamp(34px,6vw,58px);color:var(--teal-ink);line-height:1}
.brand .mark b{font-weight:400;color:var(--fg)}
.brand .sub{color:var(--muted);font-size:15px}

nav.groups{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
nav.groups a{text-decoration:none;font-weight:700;font-size:15px;padding:6px 12px;border:2px solid var(--line)}
nav.groups a:hover,nav.groups a[aria-current="page"]{border-color:var(--fg)}

main{padding-block:24px 64px}
section{scroll-margin-top:16px}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(28px,4.4vw,44px)}
.hero h2 mark{background:var(--orange);color:#1d3a4b;padding:0 .2em}
.hero p.lead{font-size:19px;margin-top:14px;max-width:60ch}
.qbox{background:var(--navy);color:#fff;padding:22px}
.qbox h3{font-size:22px;margin-bottom:8px;color:var(--yellow)}

.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:34px}
@media (max-width:820px){.phases{grid-template-columns:repeat(2,1fr)}}
.ph{padding:14px;color:var(--ink-on-color);min-width:0}
.ph .n{font-family:var(--display);font-size:26px;line-height:1}
.ph .t{font-weight:700}
.ph small{display:block;font-size:14px;opacity:.95;line-height:1.4;margin-top:4px}
.ph.d1{background:var(--d1);color:var(--ink-on-yellow)}.ph.d2{background:var(--d2);color:#0f3442}.ph.d3{background:var(--d3);color:#1d3a4b}.ph.d4{background:var(--red-ink)}.ph.d5{background:#215068}
.ph.dim{opacity:.55}

h2.sec{font-size:30px;margin:48px 0 6px}
.sec-sub{color:var(--muted);margin-bottom:18px;max-width:70ch}

.senses{display:grid;gap:26px}
.sense h3{font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sense h3 .sw{width:18px;height:18px;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;border:2px solid var(--line);text-decoration:none;min-width:0;background:var(--bg);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--fg);transform:translateY(-2px)}
.card .k{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.card .h{font-family:var(--display);font-size:21px;line-height:1.2}
.card .c{font-size:15px;color:var(--muted)}

.intel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:900px){.intel{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.intel{grid-template-columns:1fr}}
.in{border-top:6px solid var(--orange);background:var(--soft);padding:14px;min-width:0}
.in h4{font-size:19px}
.in p{font-size:15px;margin-top:4px}

/* project page */
.crumb{font-size:15px;color:var(--muted);margin-bottom:10px}
.crumb a{font-weight:700}
.ptitle{font-size:clamp(30px,5vw,50px)}
.pmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:14px;font-weight:700;padding:3px 10px;background:var(--soft);border:1px solid var(--line)}
.contrast{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-top:22px;align-items:stretch}
.contrast div{padding:14px 16px;font-family:var(--display);font-size:21px;line-height:1.25;min-width:0}
.contrast .a{background:var(--navy);color:#fff}
.contrast .x{background:var(--yellow);color:#1d3a4b;display:flex;align-items:center;font-size:26px}
.contrast .b{background:var(--teal);color:#0f3442}
@media (max-width:560px){.contrast{grid-template-columns:1fr}.contrast .x{justify-content:center;padding:4px}}

.stage{margin-top:40px;display:grid;grid-template-columns:120px 1fr;gap:20px}
@media (max-width:720px){.stage{grid-template-columns:1fr;gap:10px}}
.stage>aside{padding:12px;min-width:0}
.stage>aside .n{font-family:var(--display);font-size:34px;line-height:1}
.stage>aside .t{font-family:var(--display);font-size:20px}
.stage>aside small{display:block;font-size:13px;line-height:1.35;margin-top:4px}
.stage.d1>aside{background:var(--d1);color:#1d3a4b}
.stage.d2>aside{background:var(--d2);color:#0f3442}
.stage.d34>aside{background:var(--d3);color:#1d3a4b;border-bottom:12px solid var(--red-ink)}
.stage>div{min-width:0;display:grid;gap:22px}
.stage h3{font-size:23px;margin-bottom:8px}
.stage h4{font-size:18px;margin-bottom:6px}
ul.q{margin:0;padding-inline-start:20px;display:grid;gap:6px}
ul.q li::marker{color:var(--orange)}
.legs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:720px){.legs{grid-template-columns:1fr}}
.leg{border:2px solid var(--line);padding:12px;min-width:0}
.leg b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--teal-ink)}
.leg p{font-size:15px}

.builder{background:var(--soft);padding:16px;border-inline-start:6px solid var(--yellow)}
.builder .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media (max-width:600px){.builder .grid{grid-template-columns:1fr}}
.builder label{font-size:14px;font-weight:700;display:grid;gap:4px}
.builder input{font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.builder .out{margin-top:14px;font-family:var(--display);font-size:21px;line-height:1.35}
.builder .out span{background:var(--yellow);color:#1d3a4b;padding:0 .15em}
.builder .out span.empty{background:transparent;color:var(--muted);border-bottom:2px dashed var(--muted)}
.btn{font:inherit;font-weight:700;font-size:15px;padding:7px 14px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--fg);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.note{font-size:14px;color:var(--muted)}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:820px){.tools{grid-template-columns:1fr}}
.tool{border:2px solid var(--line);padding:14px;min-width:0}
.tool h4{display:flex;gap:8px;align-items:flex-start}
.tool input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:2px}
.tool ul{margin:6px 0 0;padding-inline-start:18px;font-size:15px;display:grid;gap:4px}

/* links */
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:14px;font-weight:700;padding:4px 10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
ol.links{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0;counter-reset:l}
ol.links li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line);counter-increment:l}
ol.links li::before{content:counter(l);font-family:var(--display);font-size:24px;color:var(--teal-ink);line-height:1.1;font-variant-numeric:tabular-nums}
ol.links li>div{min-width:0}
ol.links a.t{font-weight:700;font-size:18px;text-decoration-color:var(--teal);text-underline-offset:3px;overflow-wrap:anywhere}
ol.links .tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tag{font-size:12px;font-weight:700;padding:1px 8px;letter-spacing:.03em}
.tag.d1{background:var(--d1);color:#1d3a4b}.tag.d2{background:var(--d2);color:#0f3442}
.tag.kind{background:var(--soft);border:1px solid var(--line)}
ol.links p{font-size:16px}
ol.links .use{font-size:15px;color:var(--muted);margin-top:4px}
ol.links .use b{color:var(--fg)}

.nosol{background:var(--red-ink);color:#fff;padding:14px 16px;font-weight:700}
.nosol b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.iq{display:grid;gap:8px}
.iq details{border:2px solid var(--line);padding:0}
.iq summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-size:19px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.iq summary::-webkit-details-marker{display:none}
.iq summary::after{content:"+";color:var(--orange)}
.iq details[open] summary::after{content:"–"}
.iq details>div{padding:0 14px 14px}
.iq .def{font-size:14px;color:var(--muted);margin-bottom:6px}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:20px}
.gi{border:2px solid var(--line);display:flex;flex-direction:column;min-width:0}
.gi .pic{aspect-ratio:16/9;max-width:100%;display:flex;align-items:center;justify-content:center}
.gi .pic svg{height:70%}
.gi .gb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gi h3{font-size:22px}
.gi p{font-size:15px}
.gi .use{font-size:14px;color:var(--muted)}
.gi .more{margin-top:auto;font-weight:700;text-decoration:none;color:var(--fg);border-top:1px solid var(--line);padding-top:8px}
.gi .more:hover{color:var(--orange)}
.tikcta{display:grid;gap:4px;margin-top:10px;padding:16px 18px;background:var(--navy);color:#fff;text-decoration:none}.tikcta b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--yellow)}.tikcta:hover{outline:3px solid var(--yellow)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:48px;flex-wrap:wrap}
.pager a{font-weight:700;text-decoration:none;border:2px solid var(--line);padding:10px 14px;max-width:48%}
.pager a:hover{border-color:var(--fg)}
/* companion to the process portfolio */
.tprog{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.tprog .bar{flex:1;min-width:160px;height:12px;background:var(--soft);border:1px solid var(--line)}
.tprog .bar span{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.airules{background:var(--navy);color:#fff;padding:18px 20px;margin-top:20px}
.airules h3{font-size:22px;color:var(--yellow);margin-bottom:8px}
.airules ol{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.tjump{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.tjump a{text-decoration:none;font-weight:700;font-size:15px;padding:6px 12px}
.stage.tk{margin-top:36px}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.chk input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:3px}
ul.chk input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--teal)}
.warnl{border-inline-start:6px solid var(--red);padding:8px 12px;background:var(--soft);font-weight:700}
.mix{border:2px solid var(--fg);padding:16px}
.mix .k{display:inline-block;font-size:13px;font-weight:700;background:var(--yellow);color:#1d3a4b;padding:2px 8px;margin-bottom:8px}
.mix ol{margin:6px 0 0;padding-inline-start:22px;display:grid;gap:6px}
.mix .trace{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.sl{display:inline-block;font-size:13px;background:var(--soft);border:1px solid var(--line);padding:0 6px;margin-inline-end:4px;white-space:nowrap}
.xq{background:var(--yellow);color:#1d3a4b;padding:16px}
.xq ol{margin:6px 0 0;padding-inline-start:22px;display:grid;gap:4px;font-weight:700}
.prm{background:var(--soft);padding:14px 16px;border-inline-start:6px solid var(--teal)}
.prm blockquote{margin:8px 0 0;padding:10px 12px;background:var(--bg);border:1px dashed var(--muted);font-size:16px}
.rub summary{cursor:pointer;font-weight:700;color:var(--muted)}
.rub table,.rubt{border-collapse:collapse;width:100%;margin-top:8px;font-size:15px}
.rub td,.rubt td{border-top:1px solid var(--line);padding:6px 4px}
.rub td:last-child,.rubt td:last-child{width:60px;text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums}
/* seven habits */
.lead2{font-family:var(--display);font-size:clamp(24px,3.6vw,34px);margin-top:10px;line-height:1.25}
.lead2 mark{background:var(--yellow);color:#1d3a4b;padding:0 .2em}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-weight:700;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:middle}
.why{background:var(--soft);border-inline-start:6px solid var(--navy);padding:16px 18px;margin-top:20px}
.why h3{font-size:22px;margin-bottom:6px}
.hb{display:grid;grid-template-columns:72px 1fr;gap:18px;margin-top:40px;padding-top:24px;border-top:2px solid var(--line)}
@media (max-width:600px){.hb{grid-template-columns:1fr;gap:6px}}
.hb>div{min-width:0;display:grid;gap:12px;align-content:start}
.hn{font-family:var(--display);font-size:44px;line-height:1;color:var(--teal-ink)}
.hb h3{font-size:28px}
.hsub{font-size:18px;color:var(--muted)}
.where{display:inline-block;justify-self:start;font-size:14px;font-weight:700;background:var(--navy);color:#fff;padding:3px 10px}
.ashaf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:600px){.ashaf{grid-template-columns:1fr}}
.ashaf div{border:2px solid var(--line);padding:12px;display:grid;gap:2px;min-width:0}
.ashaf b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--teal-ink)}
.ashaf span{font-weight:700;font-size:18px}
.ashaf small{font-size:14px;color:var(--muted)}
.tscroll{overflow-x:auto;max-width:100%}
table.jt{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.jt th{text-align:start;font-size:13px;color:var(--muted);border-bottom:2px solid var(--fg);padding:6px}
.jt td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
.pull{font-family:var(--display);font-size:20px;line-height:1.35;border-inline-start:6px solid var(--yellow);padding:6px 14px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
@media (max-width:600px){.ba{grid-template-columns:1fr}.ba .arr{transform:rotate(-90deg);justify-self:center}}
.ba>div:not(.arr){border:2px solid var(--line);padding:12px;font-family:var(--display);font-size:18px;line-height:1.35;min-width:0}
.ba>div:last-child{border-color:var(--teal)}
.ba small{display:block;font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted)}
.ba .arr{align-self:center;font-size:26px}
.two,.cred{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:600px){.two,.cred{grid-template-columns:1fr}}
.two div,.cred div{background:var(--soft);padding:12px;min-width:0}
.two b,.cred b{font-family:var(--display);font-weight:400;font-size:19px}
ol.honest{margin:0;padding-inline-start:24px;display:grid;gap:8px;font-family:var(--display);font-size:19px;line-height:1.35}
.okay{background:var(--teal);color:#0f3442;padding:12px 16px}
.stagelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.stagelist>div{border-top:6px solid;background:var(--soft);padding:12px;min-width:0}
.stagelist b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.stagelist small{color:var(--muted);font-size:13px}
.stagelist ul{margin:6px 0 0;padding-inline-start:18px;font-size:15px;display:grid;gap:4px}
.consent{border:2px solid var(--teal);padding:14px 16px}.consent h3{font-size:20px;margin-bottom:4px}
.xq .okn{margin-top:10px;font-weight:700;font-family:var(--body)}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="band" aria-hidden="true"><svg viewBox="0 0 1200 56" preserveAspectRatio="none"><path d="M0 0H760C600 10 420 24 0 40Z" fill="#f6ad0c"/><path d="M300 0H1200V44C1020 20 860 14 720 16 560 18 430 8 300 0Z" fill="#ea3144"/></svg></div>

<div class="wrap">
<header class="top">
  <div class="brand">
    <a href="#home" class="mark">החוש <b>החסר</b></a>
    <span class="sub">מיני-פרויקט בעיצוב מוצר · מגמת אמנויות העיצוב, כיתה י״א · שאלון 891589</span>
  </div>
  <nav class="groups" id="nav" aria-label="ניווט"></nav>
</header>
<main id="app"></main>
<footer>אתר השראה וכיווני חשיבה בלבד. הפתרון הוא שלכן. המקורות נבחרו כנקודת פתיחה; בדקו כל מקור בעצמכן ורשמו אותו בביבליוגרפיה.</footer>
</div>

<script>
const PROJECTS = [
/* ================= שמיעה ================= */
{id:"music",sense:"hear",title:"מוזיקה מעבר לשמע",who:"חרשים וכבדי שמיעה באירועי מוזיקה",
contrast:["דממה אקוסטית","רטט, קצב ואנרגיה בגוף"],

function glyph(how){
  const c={vib:"#f18215",touch:"#ea3144",sound:"#4bc3c0",light:"#f6ad0c",shape:"#215068",human:"#5b7482"}[how];
  const g={
    vib:`<rect x="38" y="30" width="24" height="40" fill="${c}"/><path d="M28 36q-6 14 0 28M20 30q-10 20 0 40M72 36q6 14 0 28M80 30q10 20 0 40" stroke="${c}" stroke-width="4" fill="none"/>`,
    touch:`<g fill="${c}">${[0,1,2].map(r=>[0,1].map(k=>`<circle cx="${40+k*20}" cy="${28+r*22}" r="7"/>`).join("")).join("")}</g>`,
    sound:`<path d="M24 42h12l16-14v44L36 58H24z" fill="${c}"/><path d="M62 38q8 12 0 24M70 30q14 20 0 40" stroke="${c}" stroke-width="4" fill="none"/>`,
    light:`<circle cx="50" cy="50" r="16" fill="${c}"/><g stroke="${c}" stroke-width="4">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${50+24*Math.cos(r)}" y1="${50+24*Math.sin(r)}" x2="${50+32*Math.cos(r)}" y2="${50+32*Math.sin(r)}"/>`}).join("")}</g>`,
    shape:`<polygon points="30,70 46,38 62,70" fill="${c}"/><circle cx="68" cy="40" r="10" fill="none" stroke="${c}" stroke-width="4"/><rect x="24" y="24" width="14" height="14" fill="${c}"/>`,
    human:`<circle cx="36" cy="38" r="9" fill="${c}"/><circle cx="64" cy="38" r="9" fill="${c}"/><path d="M22 72q14-22 28 0q14-22 28 0" fill="${c}"/>`
  }[how];
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${HOW[how].n}">${g}</svg>`;
}

function gallery(){
  nav("gallery");

  const btns=(key,opts)=>`<div class="filters" role="group" data-gal="${key}">`+[["all","הכול"],...opts].map(([v,n])=>`<button type="button" data-v="${v}" aria-pressed="${f[key]===v}">${n}</button>`).join("")+`</div>`;
  return `<div class="crumb"><a href="#home">כל הנושאים</a> · גלריית השראה</div>
  <h2 class="ptitle">מוצרים שמחליפים חוש</h2>
  <p class="sec-sub" style="margin-top:10px">דוגמאות למוצרים ולמערכות שכבר קיימים בעולם, ממוינים לפי החוש החסר ולפי הדרך שבה המידע מגיע למשתמש. זו השראה למחקר השוק (D2), לא פתרון להעתיק. לכל דוגמה שאלו: מה היא עושה טוב, ומה היא מפספסת?</p>
  <div style="display:grid;gap:8px;margin-top:8px">
    <div class="row"><b style="min-width:70px">חוש חסר</b>${btns("sense",Object.entries(GSENSES).map(([k,v])=>[k,v.name]))}</div>
    <div class="row"><b style="min-width:70px">איך</b>${btns("how",Object.entries(HOW).map(([k,v])=>[k,v.n]))}</div>
  </div>
  <div class="gal" id="gal">${GALLERY.map(g=>`<article class="gi" data-sense="${g.sense}" data-how="${g.how}">
    <div class="pic" style="background:color-mix(in srgb, ${HOW[g.how].c} 14%, var(--bg))">${glyph(g.how)}</div>
    <div class="gb"><div class="tags"><span class="tag" style="background:${g.sense==="touch"?"var(--red-ink)":GSENSES[g.sense].color};color:${g.sense==="hear"||g.sense==="see"?"#1d3a4b":"#fff"}">${GSENSES[g.sense].name}</span><span class="tag kind">${HOW[g.how].n}</span></div>
    <h3>${esc(g.n)}</h3><p>${esc(g.s)}</p><p class="use"><b>למה זה מעניין:</b> ${esc(g.why)}</p>
    <a class="more" href="${esc(g.u)}" target="_blank" rel="noopener">לתמונות ולמוצר ←</a></div></article>`).join("")}</div>
  <p class="note" id="gal-empty" hidden>אין דוגמאות בצירוף הזה. נסו סינון אחר.</p>`;
}
function wireGallery(){
  const apply=()=>{
    const f=store.get("gal-filter",{sense:"all",how:"all"}); let n=0;
    document.querySelectorAll(".gi").forEach(el=>{const ok=(f.sense==="all"||el.dataset.sense===f.sense)&&(f.how==="all"||el.dataset.how===f.how);el.hidden=!ok;if(ok)n++;});
    document.getElementById("gal-empty").hidden=n>0;
  };
  document.querySelectorAll("[data-gal]").forEach(g=>g.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const f=store.get("gal-filter",{sense:"all",how:"all"}); f[g.dataset.gal]=b.dataset.v; store.set("gal-filter",f);
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); apply();
  }));
  apply();
}

const store = {
  get(k,d){try{const v=localStorage.getItem("hachush:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("hachush:"+k,JSON.stringify(v))}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  n.innerHTML = `<a href="#home" ${active==="home"?'aria-current="page"':""}>כל הנושאים</a><a href="#gallery" ${active==="gallery"?'aria-current="page"':""} style="background:var(--yellow);color:#1d3a4b;border-color:var(--yellow)">גלריית השראה</a><a href="#tik" ${active==="tik"?'aria-current="page"':""} style="background:var(--navy);color:#fff;border-color:var(--navy)">מלווה לתיק</a><a href="#habits" ${active==="habits"?'aria-current="page"':""} style="background:var(--soft)">שבעה הרגלים</a>` +
    PROJECTS.map(p=>`<a href="#${p.id}" ${active===p.id?'aria-current="page"':""} style="border-bottom-color:${SENSES[p.sense].color}">${esc(p.title)}</a>`).join("");
}

function linkList(links, id){
  return `<div class="lhead"><h3>מקורות, מחקרים והשראות <span class="note">(${links.length})</span></h3>
  <div class="filters" role="group" aria-label="סינון לפי שלב" data-for="${id}">
    <button type="button" data-f="all" aria-pressed="true">הכול</button>
    <button type="button" data-f="d1" aria-pressed="false">חריש D1</button>
    <button type="button" data-f="d2" aria-pressed="false">זריעה D2</button>
  </div></div>
  <ol class="links" id="links-${id}">` + links.map(l=>`<li data-p="${l.p}"><div>
    <a class="t" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a>
    <div class="tags"><span class="tag ${l.p}">${l.p==="d1"?"חריש":"זריעה"}</span><span class="tag kind">${esc(l.k)}</span><span class="tag kind">${l.lang}</span></div>
    <p>${esc(l.s)}</p>${l.use?`<p class="use"><b>איך להשתמש:</b> ${esc(l.use)}</p>`:""}
  </div></li>`).join("") + `</ol>`;
}

  <div class="pager"><a href="#${prev.id}">→ ${esc(prev.title)}</a><a href="#${next.id}">${esc(next.title)} ←</a></div>`;
}

function wire(p){
  document.querySelectorAll(".filters").forEach(g=>{
    g.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      const f=b.dataset.f; document.querySelectorAll(`#links-${g.dataset.for} li`).forEach(li=>{li.hidden = f!=="all" && li.dataset.p!==f;});
    });
  });
  if(!p) return;
  const ins=[...document.querySelectorAll(".builder input")], out=document.getElementById("cq-out");
  const parts=[["v","כיצד נוכל ל",""],["x"," את ",""],["w"," עבור ",""],["c"," ובכך ","?"]];
  const render=()=>{
    const v={}; ins.forEach(i=>v[i.dataset.k]=i.value.trim());
    out.innerHTML = '"'+parts.map(([k,pre,post])=>esc(pre)+(v[k]?`<span>${esc(v[k])}</span>`:`<span class="empty">……</span>`)+post).join("")+'"';
    store.set("cq-"+p.id,v); return v;
  };
  ins.forEach(i=>i.addEventListener("input",render)); render();
  document.getElementById("cq-copy").addEventListener("click",()=>{
    const v=render(); const txt=`כיצד נוכל ל${v.v} את ${v.x} עבור ${v.w} ובכך ${v.c}?`;
    const msg=document.getElementById("cq-msg");
    navigator.clipboard.writeText(txt).then(()=>msg.textContent="הועתק").catch(()=>{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="מסומן. אפשר להעתיק ידנית.";});
  });
  document.querySelectorAll("[data-tool]").forEach(c=>c.addEventListener("change",()=>{
    const d=store.get("tools-"+p.id,{}); d[c.dataset.tool]=c.checked; store.set("tools-"+p.id,d);
  }));
}

function wireTik(){
  const all=[...document.querySelectorAll("[data-ck]")];
  const upd=()=>{const n=all.filter(c=>c.checked).length;document.getElementById("tik-count").textContent=`${n} מתוך ${all.length} בתיק`;document.getElementById("tik-bar").style.width=(100*n/all.length)+"%";};
  all.forEach(c=>c.addEventListener("change",()=>{const d=store.get("tik",{});d[c.dataset.ck]=c.checked;store.set("tik",d);upd();}));
  upd();
  document.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView();}));
  document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const el=document.getElementById(b.dataset.copy), msg=document.querySelector(`[data-msg="${b.dataset.copy}"]`);
    navigator.clipboard.writeText(el.textContent).then(()=>msg.textContent="הועתק").catch(()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="מסומן. אפשר להעתיק ידנית.";});
  }));
}

  <p style="margin-top:8px"><b>משתמשות רק בכלי הבינה שהמורה אישרה לכן בבית הספר.</b></p></div>

  ${H(1,"h1","יומן הכרעות","לא יומן של כל מה שעשיתן. רק הרגעים שבהם משהו הזיז החלטה.","בנספחים (שקף 28), מהיום הראשון ועד הפריחה",
  `<p>הצעה יכולה להגיע מכל מקום: ממרואיינת, מהמורה, מחברה, מאמא, מחיפוש בגוגל או מבינה מלאכותית. בכל פעם שהצעה כזו שינתה משהו בפרויקט, רושמות שורה אחת, ומצבעות את המקור.</p>
  <div class="ashaf"><div><b>א</b><span>אימצתי</span><small>לקחתי את ההצעה כמו שהיא, ואני יודעת להסביר למה היא מתאימה.</small></div><div><b>ש</b><span>שיניתי</span><small>לקחתי חלק, או התאמתי אותה לקהל היעד שלי.</small></div><div><b>פ</b><span>פסלתי</span><small>החלטתי שלא. וזה בדיוק המקום לכתוב למה.</small></div></div>

  ${row("זריעה","ai","בינה מלאכותית","שתיים משאלות הראיון שלי מכוונות לתשובה.","שיניתי","ניסחתי אותן מחדש בעצמי, כשאלות פתוחות.")}

  <div class="tscroll"><table class="jt"><thead><tr><th>תאריך ושלב</th><th>מאיפה זה הגיע</th><th>מה עשיתי</th><th>למה</th></tr></thead><tbody>

  ${H(3,"h3","מה השתנה, לא רק מה הוגש","תוצר יפה בסוף מראה מה הגשתן. לפני ואחרי מראה מה למדתן בדרך.","פעם אחת לפחות בכל שלב",

  ${H(4,"h4","שני אנשים, שתי זוויות","אדם אחד נותן סיפור. שניים כבר נותנים תמונה.","בזריעה: בחקר המשתמשים (שקפים 10 עד 15) ובפרסונה (שקף 8)",

  ${H(5,"h5","אישור לשימוש במידע","מי שסיפר לכן משהו אישי צריך לדעת איפה זה יופיע.","בתחילת כל ראיון או תצפית, ובנספחים (שקף 28)",

  ${H(6,"h6","דף קרדיטים","מעצבות מקצועיות אומרות מאיפה הגיע כל מה שאינו שלהן. זה לא מקטין את העבודה, זה מראה שאתן יודעות מה עשיתן.","בראש שקף הנספחים (שקף 28)",

  <div style="border-color:var(--d3)"><b>נביטה</b><small>שקפים 20 ו-21</small><ul><li>גם רעיונות שנפסלו נשארים בתיק, עם סיבה.</li><li>כל הדמיה מבינה מסומנת בכתום, ליד הסקיצה שלכן.</li></ul></div>
  <div style="border-color:var(--red-ink)"><b>הנצה</b><small>שקפים 22 עד 24</small><ul><li>המודל לפני ואחרי המשוב של המשתמש.</li><li>שאלה אחת: מי עוד עלול להיות מושפע מהמוצר?</li></ul></div>
  <div style="border-color:var(--navy)"><b>פריחה וסיכום</b><small>שקפים 25 עד 28</small><ul><li>דף קרדיטים בראש הנספחים.</li><li>היומן המלא בנספחים.</li><li>ארבע שאלות הכנות ברפלקציה.</li></ul></div>
  </div>
  <p style="margin-top:16px"><a class="btn" href="#tik" style="text-decoration:none;display:inline-block">למלווה לתיק, שקף אחרי שקף ←</a></p></div></section>`;
}
function wireHabits(){
  document.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView();}));
}

function route(){
  const id=(location.hash||"#home").slice(1);
  const p=PROJECTS.find(x=>x.id===id);
  const app=document.getElementById("app");
  if(id==="habits"){app.innerHTML=habits();wireHabits();document.title="שבעה הרגלים לתיק · החוש החסר";window.scrollTo(0,0);return;}
  if(id==="tik"){app.innerHTML=tik();wireTik();document.title="מלווה לתיק · החוש החסר";window.scrollTo(0,0);return;}
  if(id==="gallery"){app.innerHTML=gallery();wireGallery();document.title="גלריית השראה · החוש החסר";window.scrollTo(0,0);return;}
  app.innerHTML = p ? project(p) : home();
  wire(p);
  document.title = p ? p.title+" · החוש החסר" : "החוש החסר";
  if(p) window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
